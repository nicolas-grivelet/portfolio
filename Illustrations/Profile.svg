<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="40%" stop-color="#001845"/>
      <stop offset="100%" stop-color="#0a1936"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2F54EB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2F54EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  <circle cx="400" cy="420" r="320" fill="url(#glow)"/>
  
  <!-- Subtle tech grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
  </g>

  <!-- Elegant Avatar Badge -->
  <circle cx="400" cy="420" r="160" fill="#0E1A33" stroke="rgba(47, 84, 235, 0.4)" stroke-width="3"/>
  <text x="400" y="445" font-family="'Instrument Serif', serif" font-size="110" fill="#FFFFFF" text-anchor="middle" font-style="italic">NG</text>

  <!-- Subtitle -->
  <text x="400" y="660" font-family="'DM Sans', sans-serif" font-weight="600" font-size="28" fill="#F7F9FF" text-anchor="middle" letter-spacing="1">NICOLAS GRIVELET</text>
  <text x="400" y="700" font-family="'JetBrains Mono', monospace" font-size="16" fill="#64748B" text-anchor="middle" letter-spacing="2">ESILV &amp; EMLV · PROMOTION 2030</text>
